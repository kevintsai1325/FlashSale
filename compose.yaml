services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flashsale
      POSTGRES_USER: flashsale
      POSTGRES_PASSWORD: flashsale
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashsale"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/api/v1/info"]
      interval: 5s
      timeout: 5s
      retries: 10

  zipkin:
    image: openzipkin/zipkin:3
    ports:
      - "9411:9411"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9411/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flashsale
      SPRING_DATASOURCE_USERNAME: flashsale
      SPRING_DATASOURCE_PASSWORD: flashsale
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      GMAIL_USERNAME: ${GMAIL_USERNAME:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      APP_HEALTH_MAILPIT_URL: http://mailpit:8025/api/v1/info
      APP_HEALTH_ZIPKIN_URL: http://zipkin:9411/health
      APP_HEALTH_FRONTEND_URL: http://frontend/internal-health
      APP_HEALTH_NGINX_URL: http://nginx:8080/internal-health
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      zipkin:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10

  # P4：搶購入口。與 backend 共用同一個 Postgres（步驟 1），
  # 活動資料靠內部 HTTP 呼叫 backend 取得。
  purchase-service:
    build: ./purchase-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flashsale
      SPRING_DATASOURCE_USERNAME: flashsale
      SPRING_DATASOURCE_PASSWORD: flashsale
      # 只要公鑰：purchase-service 驗證 token，不簽發 token。
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      APP_FLASH_SALE_BASE_URL: http://backend:8080
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build: ./frontend
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/internal-health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  nginx:
    build: ./nginx
    ports:
      - "8443:8443"
    volumes:
      - ./nginx/certs:/etc/nginx/certs
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/internal-health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
