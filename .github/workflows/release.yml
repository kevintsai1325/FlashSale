name: Release

# CI 在 main 綠燈後才建 image、才部署。手動觸發用 workflow_dispatch。
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  images:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        component: [backend, frontend, nginx]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          # EC2 是 t3（amd64）。要換 Graviton 才需要 multi-arch，建置時間會翻倍。
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/flashsale-${{ matrix.component }}:${{ env.SHA }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # 暫時：印出 GitHub 實際送出的 OIDC claim，用來對信任政策的 sub。確認後移除。
      - name: Show OIDC claims
        run: |
          set -euo pipefail
          token=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c 'import json,sys;print(json.load(sys.stdin)["value"])')
          python3 -c "
          import base64, json, sys
          payload = sys.argv[1].split('.')[1]
          payload += '=' * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          print(json.dumps({k: claims.get(k) for k in
                ['sub','aud','repository','ref','event_name','workflow_ref','repository_owner']}, indent=2))
          " "$token"
      # OIDC 換臨時憑證，不存 access key；EC2 也不開任何 inbound port。
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy via SSM
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "FlashSale deploy ${SHA:0:12}" \
            --parameters "commands=[\
          \"set -euo pipefail\",\
          \"cd /opt/flashsale\",\
          \"git fetch --prune origin\",\
          \"git checkout -f $SHA\",\
          \"exec ./scripts/k8s/ec2-deploy.sh $SHA\"]" \
            --query 'Command.CommandId' --output text)

          echo "SSM command: $command_id"
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$INSTANCE_ID" || true

          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' --output text
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query 'StandardErrorContent' --output text >&2

          status=$(aws ssm get-command-invocation --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" --query 'Status' --output text)
          echo "status: $status"
          test "$status" = "Success"
