name: Release

# CI 在 main 綠燈後才建 image、才部署。手動觸發用 workflow_dispatch。
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  images:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        component: [backend, purchase-service, analytics-service, frontend, nginx]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          # EC2 是 t3（amd64）。要換 Graviton 才需要 multi-arch，建置時間會翻倍。
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/flashsale-${{ matrix.component }}:${{ env.SHA }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  # 雲端環境停掉時，部署要能整段跳過，而不是讓 SSM 對著一台關機的 EC2 輪詢十分鐘再失敗。
  # 開關是 repository variable DEPLOY_ENABLED；沒設定時值是空字串，條件不成立 ——
  # 也就是說預設不部署，要部署必須明確把它設成 true（Settings > Secrets and variables >
  # Actions > Variables）。建映像不受影響，ghcr 上的映像照樣跟著 main 更新。
  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # OIDC 換臨時憑證，不存 access key；EC2 也不開任何 inbound port。
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy via SSM
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "FlashSale deploy ${SHA:0:12}" \
            --parameters "commands=[\
          \"set -euo pipefail\",\
          \"cd /opt/flashsale\",\
          \"git fetch --prune origin\",\
          \"git checkout -f $SHA\",\
          \"exec ./scripts/k8s/ec2-deploy.sh $SHA\"]" \
            --query 'Command.CommandId' --output text)

          echo "SSM command: $command_id"

          # 不用 `aws ssm wait command-executed`：它上限只有 100 秒，但 ec2-deploy.sh
          # 光三個 rollout status 就允許 300 秒。自己輪詢到終態，上限 10 分鐘。
          # 剛送出時 get-command-invocation 會回 InvocationDoesNotExist，所以吞掉錯誤。
          status=Pending
          for _ in $(seq 60); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" --query 'Status' --output text 2>/dev/null || echo Pending)
            case "$status" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 10
          done

          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' --output text
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query 'StandardErrorContent' --output text >&2

          echo "status: $status"
          test "$status" = "Success"
