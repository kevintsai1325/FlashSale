name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Ensure gradlew is executable
        run: chmod +x gradlew
      - name: Run backend tests
        run: ./gradlew test

  # P4 步驟 1 建了這個服務的映像卻沒有跑它的測試——CI 只跑 backend。
  # 步驟 2 順手補上：一個沒有人執行的測試套件等於沒有測試套件。
  purchase-service:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: purchase-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Ensure gradlew is executable
        run: chmod +x gradlew
      - name: Run purchase-service tests
        run: ./gradlew test

  order-service:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: order-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Ensure gradlew is executable
        run: chmod +x gradlew
      - name: Run order-service tests
        run: ./gradlew test

  analytics-service:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: analytics-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Ensure gradlew is executable
        run: chmod +x gradlew
      - name: Run analytics-service tests
        run: ./gradlew test

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check and build
        run: npm run build
      - name: Run frontend tests
        run: npm test

  scripts:
    # 這台開發機的系統 ANSI 代碼頁是 950（Big5）。沒有 BOM 的 .ps1 若含中文，
    # Windows PowerShell 5.1 會用 Big5 解碼，可能把註解行尾的換行吃掉、讓下一行程式碼
    # 被併進註解。本專案踩過兩次，症狀是與真正原因無關的「變數未定義」錯誤。
    # 這個檢查不依賴 PowerShell，因此可以在 ubuntu runner 上跑。
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: PowerShell 腳本編碼檢查
        run: node scripts/tests/ps1-encoding.mjs
      - name: 檢查程式本身的單元測試
        run: node --test scripts/tests/ps1-encoding.test.mjs
      - name: 壓測資料品質守門的單元測試
        run: node --test load-tests/k8s/analyze-saturation.test.mjs
