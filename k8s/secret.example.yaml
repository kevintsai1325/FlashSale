# Documentation-only shape. Do not apply or commit a populated copy.
# deploy.ps1 creates this Secret through stdin and preserves stateful passwords on redeploy.
apiVersion: v1
kind: Secret
metadata:
  name: flashsale-secrets
  namespace: flashsale
type: Opaque
stringData:
  POSTGRES_PASSWORD: replace-at-deploy-time
  SPRING_RABBITMQ_PASSWORD: replace-at-deploy-time
  JWT_PRIVATE_KEY: replace-at-deploy-time
  JWT_PUBLIC_KEY: replace-at-deploy-time
