apiVersion: apps/v1
kind: Deployment
metadata: {name: backend, namespace: flashsale, labels: {flashsale.dev/stage: application}}
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector: {matchLabels: {app: backend}}
  template:
    metadata: {labels: {app: backend}}
    spec:
      # 只有 app.scheduling.lock=kubernetes 的 Lease 實作需要這個 SA 的權限；
      # 預設的 Redisson 實作用不到，但綁著不會有副作用，切換時少一個步驟。
      serviceAccountName: flashsale-backend
      # Pod 被刪除時，「從 Endpoints 移除」與「收到 SIGTERM」是兩件並行的事，沒有先後保證。
      # kube-proxy 更新 iptables 規則需要時間，在那之前流量仍會被導向這個 Pod。
      # preStop 先睡一段時間再讓 SIGTERM 送達，讓規則有時間傳播完畢，避免滾動更新期間掉請求。
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          image: flashsale-backend:local
          imagePullPolicy: Never
          lifecycle:
            preStop: {exec: {command: ["sleep", "5"]}}
          envFrom: [{configMapRef: {name: flashsale-config}}]
          env:
            - {name: SPRING_DATASOURCE_PASSWORD, valueFrom: {secretKeyRef: {name: flashsale-secrets, key: POSTGRES_PASSWORD}}}
            - {name: SPRING_RABBITMQ_PASSWORD, valueFrom: {secretKeyRef: {name: flashsale-secrets, key: SPRING_RABBITMQ_PASSWORD}}}
            - {name: JWT_PRIVATE_KEY, valueFrom: {secretKeyRef: {name: flashsale-secrets, key: JWT_PRIVATE_KEY}}}
            - {name: JWT_PUBLIC_KEY, valueFrom: {secretKeyRef: {name: flashsale-secrets, key: JWT_PUBLIC_KEY}}}
          ports: [{containerPort: 8080}]
          startupProbe: {httpGet: {path: /actuator/health/liveness, port: 8080}, failureThreshold: 30, periodSeconds: 5, timeoutSeconds: 3}
          readinessProbe: {httpGet: {path: /actuator/health/readiness, port: 8080}, periodSeconds: 5}
          # timeoutSeconds 一定要明寫：Kubernetes 的預設是 1 秒，而 backend 的 limits.cpu 是 2。
          # P3 的 HPA 實驗裡，五個 JVM 同時冷啟動把 CPU 榨乾，正在忙的 Pod 連 1 秒內回一個
          # 輕量探測都做不到，於是至少 7 個 Pod（含 3 個原本健康的舊 Pod）被 liveness 殺掉重啟——
          # 擴容動作自己造成了服務中斷（docs/portfolio/scaling-and-autoscaling.md 第 4 節）。
          # 5 秒仍遠小於 periodSeconds × failureThreshold（10 × 3 = 30 秒），真的死掉的 Pod
          # 一樣會在半分鐘內被換掉，只是不再把「暫時忙不過來」誤判成「死了」。
          livenessProbe: {httpGet: {path: /actuator/health/liveness, port: 8080}, periodSeconds: 10, timeoutSeconds: 5}
          resources: {requests: {cpu: 500m, memory: 1Gi}, limits: {cpu: "2", memory: 2Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: backend, namespace: flashsale, labels: {flashsale.dev/stage: application}}
spec: {selector: {app: backend}, ports: [{name: http, port: 8080, targetPort: 8080}]}
---
# P4：搶購入口。步驟 2 起有自己的 Postgres（postgres-purchase），自己連 Redis 做預扣，
# 活動資料則走叢集內部的 HTTP 呼叫問 backend（APP_FLASH_SALE_BASE_URL）。
apiVersion: apps/v1
kind: Deployment
metadata: {name: purchase-service, namespace: flashsale, labels: {flashsale.dev/stage: application}}
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector: {matchLabels: {app: purchase-service}}
  template:
    metadata: {labels: {app: purchase-service}}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: purchase-service
          image: flashsale-purchase-service:local
          imagePullPolicy: Never
          lifecycle:
            preStop: {exec: {command: ["sleep", "5"]}}
          envFrom: [{configMapRef: {name: flashsale-config}}]
          env:
            # ConfigMap 裡的 SPRING_DATASOURCE_URL 指向 platform 的資料庫，這裡蓋掉它。
            # envFrom 先套用、env 後套用，所以這一條會贏。
            - {name: SPRING_DATASOURCE_URL, value: jdbc:postgresql://postgres-purchase:5432/purchase}
            - {name: SPRING_DATASOURCE_PASSWORD, valueFrom: {secretKeyRef: {name: flashsale-secrets, key: POSTGRES_PASSWORD}}}
            - {name: SPRING_RABBITMQ_PASSWORD, valueFrom: {secretKeyRef: {name: flashsale-secrets, key: SPRING_RABBITMQ_PASSWORD}}}
            # 只要公鑰：purchase-service 驗證 token，不簽發 token。
            - {name: JWT_PUBLIC_KEY, valueFrom: {secretKeyRef: {name: flashsale-secrets, key: JWT_PUBLIC_KEY}}}
          ports: [{containerPort: 8080}]
          startupProbe: {httpGet: {path: /actuator/health/liveness, port: 8080}, failureThreshold: 30, periodSeconds: 5, timeoutSeconds: 3}
          readinessProbe: {httpGet: {path: /actuator/health/readiness, port: 8080}, periodSeconds: 5}
          # timeoutSeconds 明寫，理由同 backend：預設的 1 秒會把「暫時忙不過來」誤判成「死了」。
          livenessProbe: {httpGet: {path: /actuator/health/liveness, port: 8080}, periodSeconds: 10, timeoutSeconds: 5}
          resources: {requests: {cpu: 500m, memory: 512Mi}, limits: {cpu: "2", memory: 1Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: purchase-service, namespace: flashsale, labels: {flashsale.dev/stage: application}}
spec: {selector: {app: purchase-service}, ports: [{name: http, port: 8080, targetPort: 8080}]}
---
# P5：後台儀表板的聚合來源。只讀 Kafka、只寫自己的讀取模型，不在任何使用者的請求路徑上。
#
# 單副本是刻意的：Kafka 的 topic 有 3 個分區，多副本會讓同一個消費者群組的分區重新分配，
# 而這個服務的工作量（每筆事件一次 upsert）遠遠用不到那個平行度。
# 要證明水平擴展的是 backend 與 purchase-service，不是這裡。
apiVersion: apps/v1
kind: Deployment
metadata: {name: analytics-service, namespace: flashsale, labels: {flashsale.dev/stage: application}}
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector: {matchLabels: {app: analytics-service}}
  template:
    metadata: {labels: {app: analytics-service}}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: analytics-service
          image: flashsale-analytics-service:local
          imagePullPolicy: Never
          lifecycle:
            preStop: {exec: {command: ["sleep", "5"]}}
          envFrom: [{configMapRef: {name: flashsale-config}}]
          env:
            - {name: SPRING_DATASOURCE_URL, value: jdbc:postgresql://postgres-analytics:5432/analytics}
            - {name: SPRING_DATASOURCE_PASSWORD, valueFrom: {secretKeyRef: {name: flashsale-secrets, key: POSTGRES_PASSWORD}}}
            # 只要公鑰：它驗證 token，不簽發 token。
            - {name: JWT_PUBLIC_KEY, valueFrom: {secretKeyRef: {name: flashsale-secrets, key: JWT_PUBLIC_KEY}}}
          ports: [{containerPort: 8080}]
          startupProbe: {httpGet: {path: /actuator/health/liveness, port: 8080}, failureThreshold: 30, periodSeconds: 5, timeoutSeconds: 3}
          readinessProbe: {httpGet: {path: /actuator/health/readiness, port: 8080}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /actuator/health/liveness, port: 8080}, periodSeconds: 10, timeoutSeconds: 5}
          resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "1", memory: 1Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: analytics-service, namespace: flashsale, labels: {flashsale.dev/stage: application}}
spec: {selector: {app: analytics-service}, ports: [{name: http, port: 8080, targetPort: 8080}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, namespace: flashsale, labels: {flashsale.dev/stage: application}}
spec:
  replicas: 1
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend}}
    spec:
      containers:
        - name: frontend
          image: flashsale-frontend:local
          imagePullPolicy: Never
          ports: [{containerPort: 80}]
          readinessProbe: {httpGet: {path: /internal-health, port: 80}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /internal-health, port: 80}, periodSeconds: 10}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 500m, memory: 256Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: frontend, namespace: flashsale, labels: {flashsale.dev/stage: application}}
spec: {selector: {app: frontend}, ports: [{name: http, port: 80, targetPort: 80}]}
