apiVersion: apps/v1
kind: Deployment
metadata: {name: mailpit, namespace: flashsale, labels: {flashsale.dev/stage: dependency}}
spec:
  replicas: 1
  selector: {matchLabels: {app: mailpit}}
  template:
    metadata: {labels: {app: mailpit}}
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.27.9
          ports: [{name: http, containerPort: 8025}, {name: smtp, containerPort: 1025}]
          readinessProbe: {httpGet: {path: /api/v1/info, port: 8025}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /api/v1/info, port: 8025}, periodSeconds: 10}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: mailpit, namespace: flashsale, labels: {flashsale.dev/stage: dependency}}
spec:
  type: ClusterIP
  selector: {app: mailpit}
  ports:
    - {name: http, port: 8025, targetPort: 8025}
    - {name: smtp, port: 1025, targetPort: 1025}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: zipkin, namespace: flashsale, labels: {flashsale.dev/stage: dependency}}
spec:
  replicas: 1
  selector: {matchLabels: {app: zipkin}}
  template:
    metadata: {labels: {app: zipkin}}
    spec:
      containers:
        - name: zipkin
          image: openzipkin/zipkin:3
          # 記憶體內儲存的 span 上限。預設是 500000，在 512Mi 的容器裡放不下——P3 的飽和壓測
          # 期間（100% 取樣率、約 1500 req/s）Zipkin 因此 OOM，累計重啟 24 次
          # （docs/portfolio/scaling-and-autoscaling.md 第 7 節）。
          # 壓的是保存量而不是取樣率：取樣率調低會讓平常的追蹤示範失去代表性，而這個上限只影響
          # 「能往回看多久」。50000 條 span 在這個專案的請求量下仍涵蓋數分鐘的追蹤歷史，足夠示範。
          # 真正的解法是換成有儲存後端的部署（Elasticsearch／Cassandra），那時這個上限就不需要了。
          env: [{name: MEM_MAX_SPANS, value: "50000"}]
          ports: [{name: http, containerPort: 9411}]
          startupProbe: {httpGet: {path: /health, port: 9411}, failureThreshold: 30, periodSeconds: 5, timeoutSeconds: 3}
          readinessProbe: {httpGet: {path: /health, port: 9411}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: 9411}, periodSeconds: 10}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: zipkin, namespace: flashsale, labels: {flashsale.dev/stage: dependency}}
spec:
  type: ClusterIP
  selector: {app: zipkin}
  ports: [{name: http, port: 9411, targetPort: 9411}]
