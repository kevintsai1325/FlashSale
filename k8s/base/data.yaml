apiVersion: v1
kind: Service
metadata: {name: postgres-headless, namespace: flashsale, labels: {flashsale.dev/stage: dependency}}
spec:
  clusterIP: None
  selector: {app: postgres}
  ports: [{name: postgres, port: 5432, targetPort: 5432}]
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: flashsale, labels: {flashsale.dev/stage: dependency}}
spec:
  selector: {app: postgres}
  ports: [{name: postgres, port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgres, namespace: flashsale, labels: {flashsale.dev/stage: dependency}}
spec:
  serviceName: postgres-headless
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          # 預設的 max_connections 是 100，而每個 backend 副本的 HikariCP 上限是 30。
          # 三副本（90 條）已經逼近上限，五副本（150 條）會直接撞牆：新連線被拒為
          # "sorry, too many clients already"，連 psql 都進不來。
          # 這是一個在 CPU 或吞吐量到頂之前就先出現的硬天花板，2026-09-13 的 P3 壓測實際踩到。
          # 調高到 300 讓副本數不再被資料庫的連線上限綁住；真正的解法是 P4/P5 拆分服務與資料庫，
          # 讓每個服務只帶自己的連線池。
          args: ["-c", "max_connections=300"]
          envFrom: [{configMapRef: {name: flashsale-config}}]
          env: [{name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: flashsale-secrets, key: POSTGRES_PASSWORD}}}]
          ports: [{containerPort: 5432}]
          startupProbe: {exec: {command: [pg_isready, -U, flashsale]}, failureThreshold: 30, periodSeconds: 5, timeoutSeconds: 3}
          readinessProbe: {exec: {command: [pg_isready, -U, flashsale]}, initialDelaySeconds: 5, periodSeconds: 5}
          livenessProbe: {exec: {command: [pg_isready, -U, flashsale]}, initialDelaySeconds: 20, periodSeconds: 10}
          resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "2", memory: 2Gi}}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 10Gi}}}
---
# P4 步驟 2：purchase-service 自己的 Postgres。
#
# 為什麼是獨立的 instance 而不是同一個 Postgres 開第二個 database：
# database per service 的價值不在於「資料放在不同檔案裡」，而在於**移除跨服務直接讀寫的
# 可能性**。同一個 instance 只是把耦合藏進連線字串，第一個趕工的人就會把跨庫查詢加回來。
# 雲端上這個選擇對應的是「每個服務一個 RDS instance」。
#
# 代價是多一份記憶體，以及多一套備份／監控／升級。這個代價要寫進文件，不能假裝沒有。
#
# max_connections 用預設的 100：這裡只有 purchase-service 連進來，3 副本 x 15 = 45。
# platform 那邊之所以要調到 300，正是因為所有服務都擠在同一個 instance ——
# 拆庫之後那個理由在這裡不成立。
apiVersion: v1
kind: Service
metadata: {name: postgres-purchase-headless, namespace: flashsale, labels: {flashsale.dev/stage: dependency}}
spec:
  clusterIP: None
  selector: {app: postgres-purchase}
  ports: [{name: postgres, port: 5432, targetPort: 5432}]
---
apiVersion: v1
kind: Service
metadata: {name: postgres-purchase, namespace: flashsale, labels: {flashsale.dev/stage: dependency}}
spec:
  selector: {app: postgres-purchase}
  ports: [{name: postgres, port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgres-purchase, namespace: flashsale, labels: {flashsale.dev/stage: dependency}}
spec:
  serviceName: postgres-purchase-headless
  replicas: 1
  selector: {matchLabels: {app: postgres-purchase}}
  template:
    metadata: {labels: {app: postgres-purchase}}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_DB, value: purchase}
            - {name: POSTGRES_USER, value: flashsale}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: flashsale-secrets, key: POSTGRES_PASSWORD}}}
          ports: [{containerPort: 5432}]
          startupProbe: {exec: {command: [pg_isready, -U, flashsale]}, failureThreshold: 30, periodSeconds: 5, timeoutSeconds: 3}
          readinessProbe: {exec: {command: [pg_isready, -U, flashsale]}, initialDelaySeconds: 5, periodSeconds: 5}
          livenessProbe: {exec: {command: [pg_isready, -U, flashsale]}, initialDelaySeconds: 20, periodSeconds: 10}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 5Gi}}}
---
# P5：analytics-service 的讀取模型。**這個資料庫裡沒有一筆權威資料** ——
# 全部是從 Kafka 事件算出來的投影，刪掉之後把 consumer group 的 offset 倒回去就能重建。
# 因此它的儲存空間與資源都刻意給得比別人小。
apiVersion: v1
kind: Service
metadata: {name: postgres-analytics-headless, namespace: flashsale, labels: {flashsale.dev/stage: dependency}}
spec:
  clusterIP: None
  selector: {app: postgres-analytics}
  ports: [{name: postgres, port: 5432, targetPort: 5432}]
---
apiVersion: v1
kind: Service
metadata: {name: postgres-analytics, namespace: flashsale, labels: {flashsale.dev/stage: dependency}}
spec:
  selector: {app: postgres-analytics}
  ports: [{name: postgres, port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgres-analytics, namespace: flashsale, labels: {flashsale.dev/stage: dependency}}
spec:
  serviceName: postgres-analytics-headless
  replicas: 1
  selector: {matchLabels: {app: postgres-analytics}}
  template:
    metadata: {labels: {app: postgres-analytics}}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_DB, value: analytics}
            - {name: POSTGRES_USER, value: flashsale}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: flashsale-secrets, key: POSTGRES_PASSWORD}}}
          ports: [{containerPort: 5432}]
          startupProbe: {exec: {command: [pg_isready, -U, flashsale]}, failureThreshold: 30, periodSeconds: 5, timeoutSeconds: 3}
          readinessProbe: {exec: {command: [pg_isready, -U, flashsale]}, initialDelaySeconds: 5, periodSeconds: 5}
          livenessProbe: {exec: {command: [pg_isready, -U, flashsale]}, initialDelaySeconds: 20, periodSeconds: 10}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 5Gi}}}
---
apiVersion: v1
kind: Service
metadata: {name: redis-headless, namespace: flashsale, labels: {flashsale.dev/stage: dependency}}
spec:
  clusterIP: None
  selector: {app: redis}
  ports: [{name: redis, port: 6379, targetPort: 6379}]
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: flashsale, labels: {flashsale.dev/stage: dependency}}
spec:
  selector: {app: redis}
  ports: [{name: redis, port: 6379, targetPort: 6379}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: redis, namespace: flashsale, labels: {flashsale.dev/stage: dependency}}
spec:
  serviceName: redis-headless
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: [redis-server, --appendonly, "yes", --appendfsync, everysec]
          ports: [{containerPort: 6379}]
          startupProbe: {exec: {command: [redis-cli, ping]}, failureThreshold: 30, periodSeconds: 3, timeoutSeconds: 2}
          readinessProbe: {exec: {command: [redis-cli, ping]}, initialDelaySeconds: 3, periodSeconds: 5}
          livenessProbe: {exec: {command: [redis-cli, ping]}, initialDelaySeconds: 15, periodSeconds: 10}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
          volumeMounts: [{name: data, mountPath: /data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 2Gi}}}
---
# P4 步驟 3：Kafka 作為**領域事件**的匯流排。RabbitMQ 不動，兩者職責不同（見 architecture.md）。
#
# 為什麼是手寫 KRaft StatefulSet 而不是 Strimzi：
# Strimzi 是 K8s 上 Kafka 的事實標準，但它的價值集中在多 broker 的維運自動化
# （rebalance、滾動升級、憑證輪替），而單節點 k3s 上那些價值展示不出來。
# 代價是要多一組 CRD、一個 operator 與它的非同步 reconcile —— 後者會讓
# 「kubectl diff 對 k8s/base 無漂移」這個既有的驗證手段失效。
# 升級路徑：要多 broker 或宣告式管理 topic 時，整段換成 Strimzi 的 Kafka CR。
#
# KRaft（沒有 ZooKeeper）是 Kafka 3.3+ 的預設架構，4.0 起 ZooKeeper 已移除。
# CLUSTER_ID 必須固定：它寫進 log.dirs 的 meta.properties，重啟時不一致會拒絕啟動。
apiVersion: v1
kind: Service
metadata: {name: kafka-headless, namespace: flashsale, labels: {flashsale.dev/stage: dependency}}
spec:
  clusterIP: None
  selector: {app: kafka}
  ports: [{name: kafka, port: 9092, targetPort: 9092}, {name: controller, port: 9093, targetPort: 9093}]
---
apiVersion: v1
kind: Service
metadata: {name: kafka, namespace: flashsale, labels: {flashsale.dev/stage: dependency}}
spec:
  selector: {app: kafka}
  ports: [{name: kafka, port: 9092, targetPort: 9092}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: kafka, namespace: flashsale, labels: {flashsale.dev/stage: dependency}}
spec:
  serviceName: kafka-headless
  replicas: 1
  selector: {matchLabels: {app: kafka}}
  template:
    metadata: {labels: {app: kafka}}
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.9.0
          env:
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@kafka-0.kafka-headless.flashsale.svc.cluster.local:9093"}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka.flashsale.svc.cluster.local:9092"}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER"}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "PLAINTEXT"}
            # 單節點，複製因子只能是 1。這是展示叢集，不是可用性宣稱。
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0"}
            # 事件保留 7 天。Kafka 相對於 RabbitMQ 的關鍵差別就在這裡：訊息被消費之後仍然在，
            # 所以 analytics 與 Flink 可以重放、可以各自從自己的 offset 讀。
            - {name: KAFKA_LOG_RETENTION_HOURS, value: "168"}
            - {name: KAFKA_LOG_DIRS, value: "/var/lib/kafka/data"}
            - {name: CLUSTER_ID, value: "flashsale-kraft-0001"}
            - {name: KAFKA_HEAP_OPTS, value: "-Xms256m -Xmx512m"}
          ports: [{containerPort: 9092}, {containerPort: 9093}]
          # tcpSocket 而不是 kafka-broker-api-versions.sh：後者每次探測都要起一個 JVM，
          # 在單節點上那個成本會跟應用程式搶 CPU，而 P3 已經示範過探測誤判會造成什麼。
          startupProbe: {tcpSocket: {port: 9092}, failureThreshold: 40, periodSeconds: 5, timeoutSeconds: 3}
          readinessProbe: {tcpSocket: {port: 9092}, initialDelaySeconds: 10, periodSeconds: 10, timeoutSeconds: 3}
          livenessProbe: {tcpSocket: {port: 9092}, initialDelaySeconds: 30, periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 5}
          resources: {requests: {cpu: 250m, memory: 768Mi}, limits: {cpu: "2", memory: 1536Mi}}
          volumeMounts: [{name: data, mountPath: /var/lib/kafka}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 5Gi}}}
---
apiVersion: v1
kind: Service
metadata: {name: rabbitmq-headless, namespace: flashsale, labels: {flashsale.dev/stage: dependency}}
spec:
  clusterIP: None
  selector: {app: rabbitmq}
  ports:
    - {name: amqp, port: 5672, targetPort: 5672}
    - {name: management, port: 15672, targetPort: 15672}
---
apiVersion: v1
kind: Service
metadata: {name: rabbitmq, namespace: flashsale, labels: {flashsale.dev/stage: dependency}}
spec:
  selector: {app: rabbitmq}
  ports:
    - {name: amqp, port: 5672, targetPort: 5672}
    - {name: management, port: 15672, targetPort: 15672}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: rabbitmq, namespace: flashsale, labels: {flashsale.dev/stage: dependency}}
spec:
  serviceName: rabbitmq-headless
  replicas: 1
  selector: {matchLabels: {app: rabbitmq}}
  template:
    metadata: {labels: {app: rabbitmq}}
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          env:
            - {name: RABBITMQ_DEFAULT_USER, value: flashsale}
            - {name: RABBITMQ_DEFAULT_PASS, valueFrom: {secretKeyRef: {name: flashsale-secrets, key: SPRING_RABBITMQ_PASSWORD}}}
          ports: [{containerPort: 5672}, {containerPort: 15672}]
          startupProbe: {exec: {command: [rabbitmq-diagnostics, -q, ping]}, failureThreshold: 40, periodSeconds: 5, timeoutSeconds: 5}
          # ping 要起一個 Erlang node 去連本地節點，不是輕量檢查，預設 1s timeout 會在節點忙時誤判。
          readinessProbe: {exec: {command: [rabbitmq-diagnostics, -q, ping]}, initialDelaySeconds: 10, periodSeconds: 10, timeoutSeconds: 5}
          livenessProbe: {exec: {command: [rabbitmq-diagnostics, -q, ping]}, initialDelaySeconds: 30, periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 5}
          resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "2", memory: 2Gi}}
          volumeMounts: [{name: data, mountPath: /var/lib/rabbitmq}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 5Gi}}}
