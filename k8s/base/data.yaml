apiVersion: v1
kind: Service
metadata: {name: postgres-headless, namespace: flashsale, labels: {flashsale.dev/stage: dependency}}
spec:
  clusterIP: None
  selector: {app: postgres}
  ports: [{name: postgres, port: 5432, targetPort: 5432}]
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: flashsale, labels: {flashsale.dev/stage: dependency}}
spec:
  selector: {app: postgres}
  ports: [{name: postgres, port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgres, namespace: flashsale, labels: {flashsale.dev/stage: dependency}}
spec:
  serviceName: postgres-headless
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          # 預設的 max_connections 是 100，而每個 backend 副本的 HikariCP 上限是 30。
          # 三副本（90 條）已經逼近上限，五副本（150 條）會直接撞牆：新連線被拒為
          # "sorry, too many clients already"，連 psql 都進不來。
          # 這是一個在 CPU 或吞吐量到頂之前就先出現的硬天花板，2026-09-13 的 P3 壓測實際踩到。
          # 調高到 300 讓副本數不再被資料庫的連線上限綁住；真正的解法是 P4/P5 拆分服務與資料庫，
          # 讓每個服務只帶自己的連線池。
          args: ["-c", "max_connections=300"]
          envFrom: [{configMapRef: {name: flashsale-config}}]
          env: [{name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: flashsale-secrets, key: POSTGRES_PASSWORD}}}]
          ports: [{containerPort: 5432}]
          startupProbe: {exec: {command: [pg_isready, -U, flashsale]}, failureThreshold: 30, periodSeconds: 5, timeoutSeconds: 3}
          readinessProbe: {exec: {command: [pg_isready, -U, flashsale]}, initialDelaySeconds: 5, periodSeconds: 5}
          livenessProbe: {exec: {command: [pg_isready, -U, flashsale]}, initialDelaySeconds: 20, periodSeconds: 10}
          resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "2", memory: 2Gi}}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 10Gi}}}
---
# P4 步驟 2：purchase-service 自己的 Postgres。
#
# 為什麼是獨立的 instance 而不是同一個 Postgres 開第二個 database：
# database per service 的價值不在於「資料放在不同檔案裡」，而在於**移除跨服務直接讀寫的
# 可能性**。同一個 instance 只是把耦合藏進連線字串，第一個趕工的人就會把跨庫查詢加回來。
# 雲端上這個選擇對應的是「每個服務一個 RDS instance」。
#
# 代價是多一份記憶體，以及多一套備份／監控／升級。這個代價要寫進文件，不能假裝沒有。
#
# max_connections 用預設的 100：這裡只有 purchase-service 連進來，3 副本 x 15 = 45。
# platform 那邊之所以要調到 300，正是因為所有服務都擠在同一個 instance ——
# 拆庫之後那個理由在這裡不成立。
apiVersion: v1
kind: Service
metadata: {name: postgres-purchase-headless, namespace: flashsale, labels: {flashsale.dev/stage: dependency}}
spec:
  clusterIP: None
  selector: {app: postgres-purchase}
  ports: [{name: postgres, port: 5432, targetPort: 5432}]
---
apiVersion: v1
kind: Service
metadata: {name: postgres-purchase, namespace: flashsale, labels: {flashsale.dev/stage: dependency}}
spec:
  selector: {app: postgres-purchase}
  ports: [{name: postgres, port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgres-purchase, namespace: flashsale, labels: {flashsale.dev/stage: dependency}}
spec:
  serviceName: postgres-purchase-headless
  replicas: 1
  selector: {matchLabels: {app: postgres-purchase}}
  template:
    metadata: {labels: {app: postgres-purchase}}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_DB, value: purchase}
            - {name: POSTGRES_USER, value: flashsale}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: flashsale-secrets, key: POSTGRES_PASSWORD}}}
          ports: [{containerPort: 5432}]
          startupProbe: {exec: {command: [pg_isready, -U, flashsale]}, failureThreshold: 30, periodSeconds: 5, timeoutSeconds: 3}
          readinessProbe: {exec: {command: [pg_isready, -U, flashsale]}, initialDelaySeconds: 5, periodSeconds: 5}
          livenessProbe: {exec: {command: [pg_isready, -U, flashsale]}, initialDelaySeconds: 20, periodSeconds: 10}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 5Gi}}}
---
apiVersion: v1
kind: Service
metadata: {name: redis-headless, namespace: flashsale, labels: {flashsale.dev/stage: dependency}}
spec:
  clusterIP: None
  selector: {app: redis}
  ports: [{name: redis, port: 6379, targetPort: 6379}]
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: flashsale, labels: {flashsale.dev/stage: dependency}}
spec:
  selector: {app: redis}
  ports: [{name: redis, port: 6379, targetPort: 6379}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: redis, namespace: flashsale, labels: {flashsale.dev/stage: dependency}}
spec:
  serviceName: redis-headless
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: [redis-server, --appendonly, "yes", --appendfsync, everysec]
          ports: [{containerPort: 6379}]
          startupProbe: {exec: {command: [redis-cli, ping]}, failureThreshold: 30, periodSeconds: 3, timeoutSeconds: 2}
          readinessProbe: {exec: {command: [redis-cli, ping]}, initialDelaySeconds: 3, periodSeconds: 5}
          livenessProbe: {exec: {command: [redis-cli, ping]}, initialDelaySeconds: 15, periodSeconds: 10}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
          volumeMounts: [{name: data, mountPath: /data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 2Gi}}}
---
apiVersion: v1
kind: Service
metadata: {name: rabbitmq-headless, namespace: flashsale, labels: {flashsale.dev/stage: dependency}}
spec:
  clusterIP: None
  selector: {app: rabbitmq}
  ports:
    - {name: amqp, port: 5672, targetPort: 5672}
    - {name: management, port: 15672, targetPort: 15672}
---
apiVersion: v1
kind: Service
metadata: {name: rabbitmq, namespace: flashsale, labels: {flashsale.dev/stage: dependency}}
spec:
  selector: {app: rabbitmq}
  ports:
    - {name: amqp, port: 5672, targetPort: 5672}
    - {name: management, port: 15672, targetPort: 15672}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: rabbitmq, namespace: flashsale, labels: {flashsale.dev/stage: dependency}}
spec:
  serviceName: rabbitmq-headless
  replicas: 1
  selector: {matchLabels: {app: rabbitmq}}
  template:
    metadata: {labels: {app: rabbitmq}}
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          env:
            - {name: RABBITMQ_DEFAULT_USER, value: flashsale}
            - {name: RABBITMQ_DEFAULT_PASS, valueFrom: {secretKeyRef: {name: flashsale-secrets, key: SPRING_RABBITMQ_PASSWORD}}}
          ports: [{containerPort: 5672}, {containerPort: 15672}]
          startupProbe: {exec: {command: [rabbitmq-diagnostics, -q, ping]}, failureThreshold: 40, periodSeconds: 5, timeoutSeconds: 5}
          # ping 要起一個 Erlang node 去連本地節點，不是輕量檢查，預設 1s timeout 會在節點忙時誤判。
          readinessProbe: {exec: {command: [rabbitmq-diagnostics, -q, ping]}, initialDelaySeconds: 10, periodSeconds: 10, timeoutSeconds: 5}
          livenessProbe: {exec: {command: [rabbitmq-diagnostics, -q, ping]}, initialDelaySeconds: 30, periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 5}
          resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "2", memory: 2Gi}}
          volumeMounts: [{name: data, mountPath: /var/lib/rabbitmq}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 5Gi}}}
