apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

# release.yml 在 EC2 上把 PLACEHOLDER 換成被測過的 commit sha。
# 不要換成 latest：同名 tag 讓 kubectl apply 看不到差異，rollout 不會觸發。
images:
  - name: flashsale-backend
    newName: ghcr.io/kevintsai1325/flashsale-backend
    newTag: PLACEHOLDER
  - name: flashsale-purchase-service
    newName: ghcr.io/kevintsai1325/flashsale-purchase-service
    newTag: PLACEHOLDER
  - name: flashsale-frontend
    newName: ghcr.io/kevintsai1325/flashsale-frontend
    newTag: PLACEHOLDER
  - name: flashsale-nginx
    newName: ghcr.io/kevintsai1325/flashsale-nginx
    newTag: PLACEHOLDER

# base 保留 imagePullPolicy: Never，那是本機 k3s 的契約（見 scripts/tests/k8s-manifests-test.ps1）。
# 只有這層才從 registry 拉。
patches:
  - target: {kind: Deployment, name: backend}
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target: {kind: Deployment, name: purchase-service}
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target: {kind: Deployment, name: frontend}
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target: {kind: Deployment, name: nginx}
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  # base 維持 8080/8443（Rancher Desktop 上不佔用 host 的特權 port）。
  # EC2 的 Security Group 開的是 80/443，所以只有這層把 ServiceLB 綁到那兩個 port。
  - target: {kind: Service, name: nginx}
    patch: |
      - op: replace
        path: /spec/ports/0/port
        value: 80
      - op: replace
        path: /spec/ports/1/port
        value: 443

  # 單節點、每個 Deployment 只有 1 個 replica。預設 RollingUpdate 會先起新 Pod 才殺舊的，
  # 光 backend 就 request 1Gi，t3.medium 撐不住這個 surge，新 Pod 排不進去、舊的收不掉。
  # 先殺後起：更新期間會短暫斷線，單節點本來就沒有可用性可保。
  - target: {kind: Deployment}
    patch: |
      - op: add
        path: /spec/strategy
        value:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 0
            maxUnavailable: 1

  # 上面把 nginx Service 的 port 換成 80/443，但 base 的健康探測還指著 nginx:8080。
  # ClusterIP 上沒有 8080，封包被丟掉而不是 RST，dashboard 上就顯示「逾時」。
  - target: {kind: ConfigMap, name: flashsale-config}
    patch: |
      - op: replace
        path: /data/APP_HEALTH_NGINX_URL
        value: http://nginx/internal-health
