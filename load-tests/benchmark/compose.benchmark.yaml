# Isolated Compose project for the load harness.
#
# This file exists so a benchmark can never touch the stack you demo from. It is
# only ever used with the literal project name `flashsale-benchmark`:
#
#   docker compose -p flashsale-benchmark --project-directory . \
#     -f load-tests/benchmark/compose.benchmark.yaml up -d
#
# Run it from the repository root, and do not drop `--project-directory .`: Compose
# resolves both `build: ./backend` below and the `.env` lookup against the project
# directory, so without it the build context points at load-tests/benchmark/backend
# and JWT_PRIVATE_KEY cannot be found.
#
# Everything that could collide with the normal `flashsale` project is separated:
#
#   * project name  — `flashsale-benchmark`, which prefixes every container,
#     network, image and volume Compose creates (`flashsale-benchmark_benchmark_postgres_data`
#     is a different volume from `flashsale_postgres_data`, so `down -v` here can
#     never drop your demo data).
#   * ports         — backend on ${BENCHMARK_BACKEND_PORT:-18080}, postgres on
#     ${BENCHMARK_POSTGRES_PORT:-15432}, nginx on ${BENCHMARK_NGINX_PORT:-8444},
#     zipkin on ${BENCHMARK_ZIPKIN_PORT:-9412}. The normal stack publishes 8443
#     (nginx) and 9411 (zipkin); none of these collide, so both stacks can run at once.
#   * measured traffic still bypasses nginx — the load generator (k6) always talks
#     to the backend directly on ${BENCHMARK_BACKEND_PORT:-18080}, because nginx
#     rate-limits purchase requests per client IP (50r/s, burst 100) and a
#     single-host load generator would be measuring that limiter rather than the
#     application. See README.md, "What this measures". frontend/nginx are only
#     here so a human can browse the admin dashboard against a run's leftover data
#     (`collect.ps1 -KeepStack`) — they are never in the path k6 measures.
#
# `starts_at`/`ends_at`, stock and buyer accounts all come from fixtures.sql and
# prepare.js; nothing here seeds data.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flashsale
      POSTGRES_USER: flashsale
      POSTGRES_PASSWORD: flashsale
    ports:
      # For a DB client to inspect a run's leftover data. Not used by the harness
      # itself (that always talks to `postgres:5432` inside the compose network).
      - "${BENCHMARK_POSTGRES_PORT:-15432}:5432"
    volumes:
      - benchmark_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashsale"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/api/v1/info"]
      interval: 5s
      timeout: 5s
      retries: 10

  zipkin:
    image: openzipkin/zipkin:3
    ports:
      - "${BENCHMARK_ZIPKIN_PORT:-9412}:9411"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9411/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: ./backend
    ports:
      # Benchmark-only host port. The normal stack does not publish the backend at
      # all, so this cannot collide with it.
      - "${BENCHMARK_BACKEND_PORT:-18080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flashsale
      SPRING_DATASOURCE_USERNAME: flashsale
      SPRING_DATASOURCE_PASSWORD: flashsale
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      GMAIL_USERNAME: ${GMAIL_USERNAME:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY must be set (see repo-root .env, README.md)}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY must be set (see repo-root .env, README.md)}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      APP_HEALTH_MAILPIT_URL: http://mailpit:8025/api/v1/info
      APP_HEALTH_ZIPKIN_URL: http://zipkin:9411/health
      APP_HEALTH_FRONTEND_URL: http://frontend/internal-health
      APP_HEALTH_NGINX_URL: http://nginx:8080/internal-health
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      zipkin:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build: ./frontend
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/internal-health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  nginx:
    build: ./nginx
    ports:
      - "${BENCHMARK_NGINX_PORT:-8444}:8443"
    volumes:
      - ./nginx/certs:/etc/nginx/certs
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/internal-health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  # Deliberately not named `postgres_data`: even a mistyped project name cannot
  # resolve this to the volume the normal stack uses.
  benchmark_postgres_data:
