events {}

http {
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=purchase_limit:10m rate=50r/s;

    server {
        listen 8080;
        server_name _;
        location = /internal-health {
            access_log off;
            default_type text/plain;
            return 200 "UP\n";
        }
        # 導向假設 HTTPS 在 443（EC2 overlay 的 port 對應）。本機是 8443，但 compose 與
        # Rancher Desktop 都沒有把這個 port 對外，只有健康探針會打上面那條精確路徑。
        location / { return 301 https://$host$request_uri; }
    }

    server {
        listen 8443 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/localhost.crt;
        ssl_certificate_key /etc/nginx/certs/localhost.key;

        add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location ~ ^/api/auth/(login|register) {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/flash-sales/\d+/purchase-requests$ {
            limit_req zone=purchase_limit burst=100 nodelay;
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://backend:8080/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /swagger-ui/ {
            proxy_pass http://backend:8080/swagger-ui/;
        }

        location /v3/api-docs {
            proxy_pass http://backend:8080/v3/api-docs;
        }

        location = /actuator/health {
            proxy_pass http://backend:8080/actuator/health;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        location ~ ^/actuator/health/(liveness|readiness)$ {
            proxy_pass http://backend:8080;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        location = /actuator/metrics {
            proxy_pass http://backend:8080/actuator/metrics;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        location ~ ^/actuator/metrics/[A-Za-z0-9._-]+$ {
            proxy_pass http://backend:8080;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        location /actuator/ { return 404; }

        location / {
            proxy_pass http://frontend:80/;
            proxy_set_header Host $host;
        }
    }
}
