spring:
  datasource:
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  rabbitmq:
    listener:
      simple:
        auto-startup: false

app:
  scheduling:
    enabled: false

management:
  tracing:
    sampling:
      probability: 0

# 只有公鑰：purchase-service 只驗證 token。測試不簽 token，改用 Spring Security Test 的
# jwt() post-processor 直接塞一個已驗證的 principal —— 那條路徑不經過 JwtDecoder，
# 但這個屬性仍然必須存在，否則 JwtKeyConfig 起不來、整個 context 啟動失敗。
# 這把公鑰與 backend 測試用的是同一把，方便對照；正式環境由環境變數提供。
