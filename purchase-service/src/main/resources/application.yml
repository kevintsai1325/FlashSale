spring:
  application:
    name: purchase-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/flashsale}
    username: ${SPRING_DATASOURCE_USERNAME:flashsale}
    password: ${SPRING_DATASOURCE_PASSWORD:flashsale}
    hikari:
      # 比 backend 的 30 小：purchase-service 只碰 purchase_requests 與 outbox_events 兩張表，
      # 而步驟 1 兩個服務共用同一個 Postgres —— 兩邊的連線池會相加去撞 max_connections。
      # 3 個副本 x 15 = 45，加上 backend 的 3 x 30 = 90，總共 135，仍在 300 以內。
      maximum-pool-size: 15
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    # schema 的所有權在 backend。這裡明確關掉，不是靠「沒有加依賴」來隱性關閉。
    enabled: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    template:
      observation-enabled: true
    listener:
      simple:
        concurrency: 5
        observation-enabled: true
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
          multiplier: 2.0
          max-interval: 10000
        default-requeue-rejected: false

app:
  flash-sale:
    # monolith 的內部 API。不經 Nginx，走叢集內部的 Service 名稱。
    base-url: ${APP_FLASH_SALE_BASE_URL:http://localhost:8080}
    # 這三個數字是「活動查詢掛掉時搶購 API 怎麼壞」的完整定義，改動前先讀
    # MonolithFlashSaleClient 的註解。
    connect-timeout-ms: ${APP_FLASH_SALE_CONNECT_TIMEOUT_MS:500}
    read-timeout-ms: ${APP_FLASH_SALE_READ_TIMEOUT_MS:1000}
    cache-ttl-ms: ${APP_FLASH_SALE_CACHE_TTL_MS:2000}
    cache-grace-ms: ${APP_FLASH_SALE_CACHE_GRACE_MS:60000}

server:
  port: 8080
  tomcat:
    threads:
      max: 200
    accept-count: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      roles: ADMIN
      group:
        readiness:
          include: readinessState,db,redis,rabbit
        liveness:
          include: livenessState
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
