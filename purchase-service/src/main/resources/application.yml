spring:
  application:
    name: purchase-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/purchase}
    username: ${SPRING_DATASOURCE_USERNAME:flashsale}
    password: ${SPRING_DATASOURCE_PASSWORD:flashsale}
    hikari:
      # 15 而不是 backend 的 30：這個服務只碰兩張表、交易都很短。
      # P4 步驟 2 之後兩邊連的是不同的 Postgres instance，連線池不再相加去撞同一個
      # max_connections —— 這正是 database per service 在容量上的實際好處。
      maximum-pool-size: 15
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    # P4 步驟 2 起 schema 的所有權在這裡。
    enabled: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        # 逾時要短：發送被包在 outbox 的資料庫交易裡（見 OutboxPublisher.publishBatch），
        # broker 掛掉時預設的 delivery.timeout.ms=120000 會讓那個交易連同列鎖卡住兩分鐘。
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    template:
      observation-enabled: true
    listener:
      simple:
        concurrency: 5
        observation-enabled: true
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
          multiplier: 2.0
          max-interval: 10000
        default-requeue-rejected: false

app:
  flash-sale:
    # monolith 的內部 API。不經 Nginx，走叢集內部的 Service 名稱。
    base-url: ${APP_FLASH_SALE_BASE_URL:http://localhost:8080}
    # 這三個數字是「活動查詢掛掉時搶購 API 怎麼壞」的完整定義，改動前先讀
    # MonolithFlashSaleClient 的註解。
    connect-timeout-ms: ${APP_FLASH_SALE_CONNECT_TIMEOUT_MS:500}
    read-timeout-ms: ${APP_FLASH_SALE_READ_TIMEOUT_MS:1000}
    cache-ttl-ms: ${APP_FLASH_SALE_CACHE_TTL_MS:2000}
    cache-grace-ms: ${APP_FLASH_SALE_CACHE_GRACE_MS:60000}
  order-service:
    # P5：Redis 庫存鍵的種入值改向 order-service 要 —— 庫存跟著訂單搬走了。
    base-url: ${APP_ORDER_SERVICE_BASE_URL:http://localhost:8083}

server:
  port: 8080
  tomcat:
    threads:
      max: 200
    accept-count: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      roles: ADMIN
      group:
        readiness:
          include: readinessState,db,redis,rabbit
        liveness:
          include: livenessState
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
