spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  tracing:
    sampling:
      probability: 0

# Shared test-only RSA key pair for JwtKeyConfig, used by every IT that boots the full Spring
# context but doesn't care about JWT specifics (e.g. FlashSaleApplicationTests, FlywayMigrationIT,
# SecurityFilterChainSingletonIT, AuthControllerRegisterIT). Tests that DO care about JWT/login
# behavior (e.g. AuthControllerLoginIT) override these via @DynamicPropertySource with their own
# key pair. Never used outside tests — real deployments supply JWT_PRIVATE_KEY/JWT_PUBLIC_KEY via
# environment variables (see .env.example / compose.yaml).
