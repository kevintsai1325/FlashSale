spring:
  application:
    name: flash-sale-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/flashsale
    username: flashsale
    password: flashsale
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.flashsale: INFO
