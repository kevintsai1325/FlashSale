spring:
  application:
    name: flash-sale-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/flashsale
    username: flashsale
    password: flashsale
    hikari:
      maximum-pool-size: 30
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${GMAIL_USERNAME:}
    password: ${GMAIL_APP_PASSWORD:}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # acks=all + 冪等 producer：outbox 已經保證「至少一次」，這裡要的是不要更差。
      # acks=1 在 leader 掛掉時會靜默掉訊息，而 outbox 那邊已經標記成已發佈，永遠補不回來。
      acks: all
      properties:
        enable.idempotence: true
        # 逾時要短：發送被包在 outbox 的資料庫交易裡（見 OutboxPublisher.publishBatch），
        # broker 掛掉時預設的 delivery.timeout.ms=120000 會讓那個交易連同列鎖卡住兩分鐘。
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    template:
      observation-enabled: true
    listener:
      simple:
        concurrency: 5
        observation-enabled: true
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
          multiplier: 2.0
          max-interval: 10000
        default-requeue-rejected: false

app:
  audit:
    retention-days: 30
  purchase-service:
    # 後台儀表板的搶購統計來源。不經 Nginx，走叢集內部的 Service 名稱。
    # 逾時比搶購熱路徑寬鬆：後台頁面的使用者願意等，而失敗只會讓那一區塊顯示 0。
    base-url: ${APP_PURCHASE_SERVICE_BASE_URL:http://localhost:8081}
    connect-timeout-ms: ${APP_PURCHASE_SERVICE_CONNECT_TIMEOUT_MS:500}
    read-timeout-ms: ${APP_PURCHASE_SERVICE_READ_TIMEOUT_MS:2000}
  health:
    mailpit-url: ${APP_HEALTH_MAILPIT_URL:}
    zipkin-url: ${APP_HEALTH_ZIPKIN_URL:}
    frontend-url: ${APP_HEALTH_FRONTEND_URL:}
    nginx-url: ${APP_HEALTH_NGINX_URL:}

server:
  port: 8080
  # Tomcat 維持 Spring Boot 的預設值，這裡明寫出來是為了記錄「為什麼不調」。
  #
  # 曾經把 threads.max 調到 400、accept-count 調到 300，想解決壓測時大量連線建立不起來的問題。
  # 後來證實那個症狀的根因在 Windows 與 WSL2 之間的埠轉發層（約 225 條同時新連線後回 RST），
  # 連線根本沒到 Tomcat。從 VM 內部施壓時，即使用預設值也是 300/300 全通。
  # 詳見 docs/portfolio/performance-report.md 的「離群值與資料品質」。
  #
  # 而且 accept-count 本來就很少是瓶頸：NIO 的 Tomcat 會先接受連線直到 max-connections
  # （預設 8192），accept-count 管的是超過之後的 OS backlog。300 條突發連線碰不到它。
  #
  # threads.max 也不該憑感覺放大。同步路徑的下游上限是 HikariCP 的 30 條連線，
  # 400 個工作執行緒只會讓 370 個在應用程式內部排隊等連線池，把「快速失敗」變成「長尾延遲」。
  # 200 這個預設值相對於下游容量已經有足夠餘裕。
  tomcat:
    threads:
      max: 200
    accept-count: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      roles: ADMIN
      group:
        readiness:
          include: readinessState,db,redis,rabbit
        liveness:
          include: livenessState
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
